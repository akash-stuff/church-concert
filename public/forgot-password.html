<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead__inner">
        <a class="masthead__mark" href="/">
          <img class="masthead__logo" src="/assets/logo.svg" alt="" width="34" height="34" />
          <span class="masthead__text">
            <span class="masthead__name">Night of Worship</span>
            <span class="masthead__sub">Seat register</span>
          </span>
        </a>
        <nav data-nav aria-label="Main"></nav>
      </div>
    </header>

    <main>
      <div class="wrap wrap--narrow stack">
        <div>
          <p class="eyebrow">Account recovery</p>
          <h1>Reset your password</h1>
          <p class="muted">
            Enter your registered email address. The reset link goes to that address — check your
            inbox, and your spam folder if it is not there within a minute or two.
          </p>
        </div>

        <div class="notice" data-notice></div>

        <div class="card">
          <form id="forgot-form" novalidate>
            <div class="field">
              <label for="email">Email address</label>
              <span class="field__control field__control--inline">
                <span class="field__icon" data-icon="mail" aria-hidden="true"></span>
                <input id="email" name="email" type="email" autocomplete="email" required />
              </span>
              <span class="field__error" data-error-for="email"></span>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Send the reset link</button>
          </form>
        </div>

        <p class="center muted"><a href="/login.html">Back to sign in</a></p>
      </div>
    </main>

    <footer class="footer"><div class="wrap">Grace Community Church · <a href="/">Home</a></div></footer>


    <script src="/js/core.js"></script>
    <script src="/js/forgot.js"></script>
  </body>
</html>
