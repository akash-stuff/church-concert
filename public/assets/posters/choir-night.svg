<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="A choir in a lit sanctuary">
  <defs>
    <linearGradient id="cn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1729"/>
      <stop offset="0.55" stop-color="#1b2b48"/>
      <stop offset="1" stop-color="#2c4066"/>
    </linearGradient>
    <linearGradient id="cn-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0ac4c" stop-opacity=".85"/>
      <stop offset="1" stop-color="#e0ac4c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cn-halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#f3d69a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f3d69a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cn-sky)"/>

  <!-- Arched east window, the light source everything else answers to. -->
  <g>
    <path d="M400 44c58 0 105 47 105 105v150H295V149c0-58 47-105 105-105z" fill="#16233d"/>
    <path d="M400 60c49 0 89 40 89 89v134H311V149c0-49 40-89 89-89z" fill="url(#cn-glow)" opacity=".55"/>
    <path d="M400 60v223M311 172h178M355 66v217M445 66v217" stroke="#0d1729" stroke-width="4" opacity=".55"/>
    <ellipse cx="400" cy="190" rx="230" ry="170" fill="url(#cn-halo)" opacity=".5"/>
  </g>

  <!-- Cross, small and central. -->
  <path d="M392 196h16v40h30v16h-30v78h-16v-78h-30v-16h30z" fill="#f6e6c2" opacity=".92"/>

  <!-- Choir stalls: three tiers of singers, deliberately simplified so the
       shape reads at card size rather than at full width. -->
  <g fill="#0d1729" opacity=".9">
    <rect x="0" y="352" width="800" height="98"/>
  </g>
  <g fill="#22314e">
    <rect x="0" y="330" width="800" height="30" rx="6"/>
  </g>

  <g>
    <g fill="#2c4066">
      <circle cx="150" cy="312" r="15"/><rect x="132" y="328" width="36" height="34" rx="14"/>
      <circle cx="215" cy="308" r="15"/><rect x="197" y="324" width="36" height="38" rx="14"/>
      <circle cx="280" cy="312" r="15"/><rect x="262" y="328" width="36" height="34" rx="14"/>
      <circle cx="520" cy="312" r="15"/><rect x="502" y="328" width="36" height="34" rx="14"/>
      <circle cx="585" cy="308" r="15"/><rect x="567" y="324" width="36" height="38" rx="14"/>
      <circle cx="650" cy="312" r="15"/><rect x="632" y="328" width="36" height="34" rx="14"/>
    </g>
    <g fill="#42598a">
      <circle cx="115" cy="352" r="17"/><rect x="94" y="370" width="42" height="42" rx="16"/>
      <circle cx="188" cy="348" r="17"/><rect x="167" y="366" width="42" height="46" rx="16"/>
      <circle cx="261" cy="352" r="17"/><rect x="240" y="370" width="42" height="42" rx="16"/>
      <circle cx="334" cy="348" r="17"/><rect x="313" y="366" width="42" height="46" rx="16"/>
      <circle cx="466" cy="348" r="17"/><rect x="445" y="366" width="42" height="46" rx="16"/>
      <circle cx="539" cy="352" r="17"/><rect x="518" y="370" width="42" height="42" rx="16"/>
      <circle cx="612" cy="348" r="17"/><rect x="591" y="366" width="42" height="46" rx="16"/>
      <circle cx="685" cy="352" r="17"/><rect x="664" y="370" width="42" height="42" rx="16"/>
    </g>
  </g>

  <!-- The conductor, front and centre, picked out in gold. -->
  <g>
    <circle cx="400" cy="342" r="18" fill="#e0ac4c"/>
    <rect x="378" y="362" width="44" height="56" rx="16" fill="#b58328"/>
    <path d="M422 362l30-28" stroke="#f3d69a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Candle line along the front edge. -->
  <g fill="#e0ac4c">
    <circle cx="60" cy="424" r="4"/><circle cx="180" cy="424" r="4"/><circle cx="300" cy="424" r="4"/>
    <circle cx="500" cy="424" r="4"/><circle cx="620" cy="424" r="4"/><circle cx="740" cy="424" r="4"/>
  </g>
</svg>
