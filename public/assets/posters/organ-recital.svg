<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="A pipe organ in a vaulted sanctuary">
  <defs>
    <linearGradient id="or-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1729"/>
      <stop offset="1" stop-color="#243a61"/>
    </linearGradient>
    <linearGradient id="or-pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7d99"/>
      <stop offset="0.4" stop-color="#c8d3e4"/>
      <stop offset="0.62" stop-color="#eef3fa"/>
      <stop offset="1" stop-color="#5d6c86"/>
    </linearGradient>
    <linearGradient id="or-warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e0ac4c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e0ac4c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#or-bg)"/>

  <!-- Vaulting: two arches receding behind the instrument. -->
  <g fill="none" stroke="#2c4066" stroke-width="6" opacity=".55">
    <path d="M80 450V190a120 120 0 01240 0v260"/>
    <path d="M480 450V190a120 120 0 01240 0v260"/>
    <path d="M240 450V150a160 160 0 01320 0v300"/>
  </g>

  <!-- The pipe front: a symmetric rank, tallest at the centre. -->
  <g>
    <rect x="250" y="330" width="300" height="26" rx="6" fill="#16233d"/>
    <g fill="url(#or-pipe)">
      <rect x="262" y="196" width="20" height="138" rx="10"/>
      <rect x="290" y="168" width="22" height="166" rx="11"/>
      <rect x="320" y="140" width="24" height="194" rx="12"/>
      <rect x="352" y="112" width="26" height="222" rx="13"/>
      <rect x="386" y="90" width="28" height="244" rx="14"/>
      <rect x="422" y="112" width="26" height="222" rx="13"/>
      <rect x="456" y="140" width="24" height="194" rx="12"/>
      <rect x="488" y="168" width="22" height="166" rx="11"/>
      <rect x="518" y="196" width="20" height="138" rx="10"/>
    </g>
    <!-- Mouths, the small cut in each pipe. -->
    <g fill="#16233d" opacity=".8">
      <rect x="266" y="300" width="12" height="7" rx="3"/>
      <rect x="295" y="300" width="12" height="7" rx="3"/>
      <rect x="326" y="300" width="12" height="7" rx="3"/>
      <rect x="359" y="300" width="12" height="7" rx="3"/>
      <rect x="394" y="300" width="12" height="7" rx="3"/>
      <rect x="429" y="300" width="12" height="7" rx="3"/>
      <rect x="462" y="300" width="12" height="7" rx="3"/>
      <rect x="493" y="300" width="12" height="7" rx="3"/>
      <rect x="522" y="300" width="12" height="7" rx="3"/>
    </g>
    <!-- Carved case shoulders either side. -->
    <path d="M240 334V206c0-16 12-28 26-28h4v156z" fill="#16233d"/>
    <path d="M560 334V206c0-16-12-28-26-28h-4v156z" fill="#16233d"/>
  </g>

  <!-- Console and organist, small, to give the pipes their scale. -->
  <g>
    <rect x="352" y="356" width="96" height="44" rx="6" fill="#16233d"/>
    <rect x="360" y="362" width="80" height="10" rx="3" fill="#dfe6f1"/>
    <circle cx="400" cy="344" r="15" fill="#0b1322"/>
    <rect x="382" y="360" width="36" height="30" rx="12" fill="#0b1322"/>
  </g>

  <!-- Warm floor wash, so the bottom of the frame is not dead navy. -->
  <path d="M0 400h800v50H0z" fill="url(#or-warm)"/>
  <path d="M0 430h800v20H0z" fill="#0b1322" opacity=".6"/>
</svg>
