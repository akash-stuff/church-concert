<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="A gospel choir with raised hands under warm stage light">
  <defs>
    <linearGradient id="ge-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151027"/>
      <stop offset="0.5" stop-color="#1e2545"/>
      <stop offset="1" stop-color="#2c4066"/>
    </linearGradient>
    <radialGradient id="ge-spot" cx="0.5" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ffd98f" stop-opacity=".55"/>
      <stop offset="0.5" stop-color="#e0ac4c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e0ac4c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ge-bg)"/>
  <rect width="800" height="450" fill="url(#ge-spot)"/>

  <!-- Overhead rig. -->
  <g>
    <rect x="0" y="26" width="800" height="10" rx="5" fill="#0b1322"/>
    <g fill="#0b1322">
      <rect x="150" y="36" width="26" height="20" rx="4"/>
      <rect x="330" y="36" width="26" height="20" rx="4"/>
      <rect x="450" y="36" width="26" height="20" rx="4"/>
      <rect x="630" y="36" width="26" height="20" rx="4"/>
    </g>
    <g fill="#ffd98f" opacity=".9">
      <circle cx="163" cy="58" r="5"/><circle cx="343" cy="58" r="5"/>
      <circle cx="463" cy="58" r="5"/><circle cx="643" cy="58" r="5"/>
    </g>
  </g>

  <!-- Radiating light behind the choir, the picture's centre of gravity. -->
  <g stroke="#e0ac4c" stroke-width="3" opacity=".22">
    <path d="M400 250L120 60M400 250L240 40M400 250L400 30M400 250L560 40M400 250L680 60"/>
  </g>

  <!-- Choir: three rows, arms up in the back row. -->
  <g fill="#141d33">
    <g>
      <circle cx="150" cy="248" r="18"/><rect x="128" y="268" width="44" height="60" rx="18"/>
      <path d="M126 272l-20-38M174 272l20-38" stroke="#141d33" stroke-width="11" stroke-linecap="round"/>
      <circle cx="270" cy="240" r="18"/><rect x="248" y="260" width="44" height="68" rx="18"/>
      <path d="M246 264l-20-42M294 264l20-42" stroke="#141d33" stroke-width="11" stroke-linecap="round"/>
      <circle cx="530" cy="240" r="18"/><rect x="508" y="260" width="44" height="68" rx="18"/>
      <path d="M506 264l-20-42M554 264l20-42" stroke="#141d33" stroke-width="11" stroke-linecap="round"/>
      <circle cx="650" cy="248" r="18"/><rect x="628" y="268" width="44" height="60" rx="18"/>
      <path d="M626 272l-20-38M674 272l20-38" stroke="#141d33" stroke-width="11" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Soloist at the microphone, the one figure in gold. -->
  <g>
    <circle cx="400" cy="230" r="22" fill="#e0ac4c"/>
    <rect x="372" y="254" width="56" height="86" rx="24" fill="#b58328"/>
    <path d="M372 268l-26 20" stroke="#b58328" stroke-width="13" stroke-linecap="round"/>
    <path d="M428 268l24-30" stroke="#b58328" stroke-width="13" stroke-linecap="round"/>
    <circle cx="456" cy="232" r="9" fill="#0b1322"/>
    <path d="M456 241v26" stroke="#0b1322" stroke-width="4"/>
  </g>

  <g fill="#22314e">
    <circle cx="210" cy="300" r="20"/><rect x="186" y="322" width="48" height="70" rx="20"/>
    <circle cx="310" cy="296" r="20"/><rect x="286" y="318" width="48" height="74" rx="20"/>
    <circle cx="490" cy="296" r="20"/><rect x="466" y="318" width="48" height="74" rx="20"/>
    <circle cx="590" cy="300" r="20"/><rect x="566" y="322" width="48" height="70" rx="20"/>
  </g>

  <!-- Stage lip. -->
  <path d="M0 392h800v58H0z" fill="#0b1322"/>
  <path d="M0 392h800v6H0z" fill="#e0ac4c" opacity=".35"/>
</svg>
