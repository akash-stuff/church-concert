<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Congregation with raised hands before a lit cross">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B3F"/>
      <stop offset=".55" stop-color="#12306E"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DBEAFE" stop-opacity=".85"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#EFF6FF" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#93C5FD" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crowd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1733" stop-opacity=".82"/>
      <stop offset="1" stop-color="#050B1C"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="560" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="560" fill="url(#sky)"/>

    <!-- stage lights -->
    <g>
      <path d="M120 0 40 330 210 330 180 0z" fill="url(#beam)" opacity=".5"/>
      <path d="M300 0 250 340 400 340 350 0z" fill="url(#beam)" opacity=".38"/>
      <path d="M500 0 460 340 610 340 560 0z" fill="url(#beam)" opacity=".38"/>
      <path d="M690 0 640 330 800 330 760 0z" fill="url(#beam)" opacity=".5"/>
    </g>

    <!-- haze -->
    <ellipse cx="400" cy="290" rx="330" ry="230" fill="url(#glow)"/>

    <!-- cross -->
    <g fill="#EFF6FF">
      <rect x="384" y="120" width="32" height="230" rx="6"/>
      <rect x="326" y="186" width="148" height="32" rx="6"/>
    </g>
    <g fill="#BFDBFE" opacity=".65">
      <rect x="384" y="120" width="10" height="230" rx="5"/>
      <rect x="326" y="186" width="148" height="10" rx="5"/>
    </g>

    <!-- distant lamps -->
    <g fill="#DBEAFE" opacity=".55">
      <circle cx="120" cy="70" r="4"/><circle cx="205" cy="46" r="3"/><circle cx="612" cy="60" r="4"/>
      <circle cx="700" cy="40" r="3"/><circle cx="308" cy="52" r="3"/><circle cx="512" cy="44" r="3"/>
    </g>

    <!-- congregation, raised hands -->
    <g fill="url(#crowd)">
      <path d="M0 430c60-6 96-30 140-30s78 26 132 26 92-30 140-30 92 32 148 32 88-26 140-26 76 14 100 18v140H0z"/>
    </g>
    <g fill="#050B1C">
      <g>
        <circle cx="70" cy="418" r="26"/><rect x="34" y="440" width="72" height="120" rx="30"/>
        <rect x="42" y="330" width="15" height="112" rx="7.5" transform="rotate(-13 49 386)"/>
        <rect x="96" y="342" width="15" height="106" rx="7.5" transform="rotate(11 103 395)"/>
      </g>
      <g>
        <circle cx="205" cy="446" r="24"/><rect x="173" y="466" width="66" height="94" rx="28"/>
        <rect x="180" y="372" width="14" height="98" rx="7" transform="rotate(-9 187 421)"/>
        <rect x="228" y="380" width="14" height="94" rx="7" transform="rotate(9 235 427)"/>
      </g>
      <g>
        <circle cx="340" cy="424" r="27"/><rect x="303" y="447" width="74" height="113" rx="31"/>
        <rect x="310" y="326" width="15" height="124" rx="7.5" transform="rotate(-11 317 388)"/>
        <rect x="366" y="336" width="15" height="118" rx="7.5" transform="rotate(12 373 395)"/>
      </g>
      <g>
        <circle cx="470" cy="440" r="25"/><rect x="436" y="462" width="70" height="98" rx="29"/>
        <rect x="444" y="360" width="14" height="106" rx="7" transform="rotate(-10 451 413)"/>
        <rect x="496" y="368" width="14" height="102" rx="7" transform="rotate(10 503 419)"/>
      </g>
      <g>
        <circle cx="606" cy="418" r="27"/><rect x="569" y="441" width="74" height="119" rx="31"/>
        <rect x="576" y="318" width="15" height="128" rx="7.5" transform="rotate(-12 583 382)"/>
        <rect x="632" y="330" width="15" height="120" rx="7.5" transform="rotate(11 639 390)"/>
      </g>
      <g>
        <circle cx="734" cy="448" r="24"/><rect x="702" y="468" width="66" height="92" rx="28"/>
        <rect x="708" y="378" width="14" height="96" rx="7" transform="rotate(-9 715 426)"/>
        <rect x="756" y="386" width="14" height="90" rx="7" transform="rotate(10 763 431)"/>
      </g>
    </g>
  </g>
</svg>
