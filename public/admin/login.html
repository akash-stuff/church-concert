<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Staff sign-in</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead__inner">
        <a class="masthead__mark" href="/">
          <img class="masthead__logo" src="/assets/logo.svg" alt="" width="34" height="34" />
          <span class="masthead__text">
            <span class="masthead__name">Night of Worship</span>
            <span class="masthead__sub">Administration</span>
          </span>
        </a>
        <nav aria-label="Main"><a href="/">Public site</a></nav>
      </div>
    </header>

    <main>
      <div class="wrap wrap--narrow stack">
        <div>
          <p class="eyebrow">Restricted</p>
          <h1>Staff sign-in</h1>
          <p class="muted">
            This area manages seats, bookings and attendee records. Attendees sign in on the
            <a href="/login.html">main site</a>.
          </p>
        </div>

        <div class="notice" data-notice></div>

        <div class="card">
          <form id="admin-login-form" novalidate>
            <div class="field">
              <label for="email">Work email</label>
              <input id="email" name="email" type="email" autocomplete="username" required />
              <span class="field__error" data-error-for="email"></span>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <span class="field__error" data-error-for="password"></span>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Sign in</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap">Grace Community Church · Administration</div>
    </footer>

    <img class="page-deco page-deco--church" src="/assets/church.svg" alt="" aria-hidden="true" />
    <img class="page-deco page-deco--sprig" src="/assets/sprig.svg" alt="" aria-hidden="true" />

    <script src="/js/core.js"></script>
    <script src="/admin/login.js"></script>
  </body>
</html>
