<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose a new password</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead__inner">
        <a class="masthead__mark" href="/">
          <img class="masthead__logo" src="/assets/logo.svg" alt="" width="34" height="34" />
          <span class="masthead__text">
            <span class="masthead__name">Night of Worship</span>
            <span class="masthead__sub">Seat register</span>
          </span>
        </a>
        <nav data-nav aria-label="Main"></nav>
      </div>
    </header>

    <main>
      <div class="wrap wrap--narrow stack">
        <div>
          <p class="eyebrow">Account recovery</p>
          <h1>Choose a new password</h1>
        </div>

        <div class="notice" data-notice></div>

        <div class="card">
          <form id="reset-form" novalidate>
            <div class="field">
              <label for="password">New password</label>
              <span class="field__control field__control--inline">
                <span class="field__icon" data-icon="lock" aria-hidden="true"></span>
                <input id="password" name="password" type="password" autocomplete="new-password" required />
              </span>
              <p class="field__hint">
                At least 10 characters, with an uppercase letter, a lowercase letter and a number.
              </p>
              <span class="field__error" data-error-for="password"></span>
            </div>
            <div class="field">
              <label for="confirm">Repeat the new password</label>
              <span class="field__control field__control--inline">
                <span class="field__icon" data-icon="shield" aria-hidden="true"></span>
                <input id="confirm" type="password" autocomplete="new-password" required />
              </span>
              <span class="field__error" data-error-for="confirm"></span>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Save my new password</button>
          </form>
        </div>

        <p class="center muted"><a href="/login.html">Back to sign in</a></p>
      </div>
    </main>

    <footer class="footer"><div class="wrap">Grace Community Church · <a href="/">Home</a></div></footer>


    <script src="/js/core.js"></script>
    <script src="/js/reset.js"></script>
  </body>
</html>
