services:
  app:
    image: church-concert:latest
    container_name: church-concert
    restart: unless-stopped

    ports:
      - "127.0.0.1:3100:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
